<title>Fichas Moove</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de cartões, como a ficha de papel que isto substitui.
   Cabeçalho fixo com o treino do dia e a barra de progresso sempre à vista. */
:root{
  --fundo:#EFF1F4;        /* concreto claro */
  --papel:#FFFFFF;
  --linha:#D7DCE3;
  --tinta:#141A22;
  --apagado:#5E6B7C;
  --forca:#E2501E;        /* laranja de academia, cor de ação */
  --feito:#1B9E63;        /* série concluída */
  --sombra:0 1px 2px rgba(20,26,34,.06), 0 8px 24px -16px rgba(20,26,34,.3);
  --titulo:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --texto:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fundo:#0E1319; --papel:#171E27; --linha:#2A3542; --tinta:#E8EDF4; --apagado:#93A1B3;
    --forca:#FF6B35; --feito:#2FBF7D;
    --sombra:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fundo:#0E1319; --papel:#171E27; --linha:#2A3542; --tinta:#E8EDF4; --apagado:#93A1B3;
  --forca:#FF6B35; --feito:#2FBF7D;
  --sombra:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--texto);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papel)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--titulo);margin:0;letter-spacing:.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--forca);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.marca{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:26px}
.logo{width:46px;height:46px;border-radius:13px;background:var(--forca);display:grid;place-items:center;flex:none;
  box-shadow:0 10px 24px -10px var(--forca)}
.logo svg{width:26px;height:26px;color:#fff}
.marca b{font-family:var(--titulo);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.marca small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--apagado);font-weight:600;font-family:var(--texto)}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:22px;box-shadow:var(--sombra);width:100%}
.campo{display:block;margin-bottom:14px}
.campo span{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado);margin-bottom:6px}
.campo input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--linha);background:var(--fundo);color:var(--tinta);font-size:16px}
.btn{all:unset;cursor:pointer;display:block;width:100%;text-align:center;background:var(--forca);color:#fff;font-weight:700;
  padding:15px;border-radius:11px;font-size:16px}
.btn.secundario{background:transparent;color:var(--tinta);border:1px solid var(--linha);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.demo{margin-top:18px;padding-top:16px;border-top:1px dashed var(--linha)}
.demo p{margin:0 0 10px;font-size:13px;color:var(--apagado)}
.demo .par{display:flex;gap:10px}
.demo .par .btn{padding:11px;font-size:14px}
.aviso{margin-top:16px;font-size:12px;color:var(--apagado);text-align:center}

/* ---------- topo do app ---------- */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--papel);border-bottom:1px solid var(--linha)}
.topo .wrap{display:flex;align-items:center;gap:12px;padding-block:11px}
.topo .quem{min-width:0;flex:1}
.topo .quem b{display:block;font-family:var(--titulo);font-size:20px;font-weight:700;line-height:1.1;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .quem span{font-size:12px;color:var(--apagado)}
.icone{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;border:1px solid var(--linha);display:grid;place-items:center;flex:none;color:var(--apagado)}
.icone:hover{color:var(--tinta)}
.icone svg{width:18px;height:18px}

/* ---------- abas de treino ---------- */
.abas{display:flex;gap:8px;padding-block:14px 4px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{all:unset;cursor:pointer;flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--linha);background:var(--papel);
  font-weight:600;font-size:14px;white-space:nowrap}
.aba b{font-family:var(--titulo);font-size:17px;margin-right:6px}
.aba[aria-selected="true"]{background:var(--tinta);color:var(--fundo);border-color:var(--tinta)}

/* ---------- progresso ---------- */
.progresso{margin-block:14px 6px}
.progresso .linha{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.progresso .linha b{font-family:var(--titulo);font-size:24px;font-weight:700}
.progresso .linha span{font-size:13px;color:var(--apagado)}
.trilho{height:8px;border-radius:99px;background:var(--linha);overflow:hidden}
.trilho i{display:block;height:100%;background:var(--feito);width:0;transition:width .35s ease}

/* ---------- exercício ---------- */
.lista{display:grid;gap:12px;padding-block:10px 24px}
.ex{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:15px;box-shadow:var(--sombra)}
.ex.pronto{border-color:color-mix(in srgb,var(--feito) 55%,var(--linha))}
.ex .cab{display:flex;gap:12px;align-items:flex-start}
.ex .ordem{font-family:var(--titulo);font-size:15px;font-weight:700;color:var(--apagado);width:22px;flex:none;padding-top:3px}
.ex h3{font-size:21px;font-weight:700;line-height:1.1;flex:1;min-width:0}
.ex .grupo{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--apagado);background:var(--fundo);border:1px solid var(--linha);border-radius:99px;padding:3px 9px}
.dados{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.dado b{display:block;font-family:var(--titulo);font-size:22px;font-weight:700;line-height:1}
.dado span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--apagado);font-weight:600}
.obs{margin:11px 0 0;font-size:13px;color:var(--apagado);border-left:3px solid var(--forca);padding-left:10px}
.series{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.serie{all:unset;cursor:pointer;width:42px;height:42px;border-radius:11px;border:1px solid var(--linha);display:grid;place-items:center;
  font-weight:700;font-variant-numeric:tabular-nums;background:var(--fundo);transition:transform .12s ease}
.serie:active{transform:scale(.93)}
.serie[aria-pressed="true"]{background:var(--feito);border-color:var(--feito);color:#fff}
.descanso{all:unset;cursor:pointer;margin-left:auto;font-size:13px;font-weight:600;color:var(--forca);display:flex;align-items:center;gap:6px}
.descanso svg{width:15px;height:15px}

/* ---------- rodapé de ação ---------- */
.rodape{position:sticky;bottom:0;background:linear-gradient(to top,var(--fundo) 60%,transparent);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px))}

/* ---------- cronômetro ---------- */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(160%);transition:transform .35s cubic-bezier(.2,.8,.3,1);pointer-events:none}
.timer.on{transform:translateY(0);pointer-events:auto}
.timer-in{width:100%;max-width:528px;background:var(--tinta);color:var(--fundo);border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.timer-in b{font-family:var(--titulo);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.timer-in .q{flex:1;min-width:0;font-size:13px;opacity:.75}
.timer-in button{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:9px 13px;border-radius:9px;background:rgba(255,255,255,.16)}

/* ---------- histórico ---------- */
.secao{padding-block:8px 28px}
.secao h2{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);margin-bottom:10px;font-family:var(--texto)}
.hist{display:grid;gap:8px}
.hist div{display:flex;justify-content:space-between;gap:12px;background:var(--papel);border:1px solid var(--linha);
  border-radius:11px;padding:11px 14px;font-size:14px}
.hist span{color:var(--apagado)}
.vazio{background:var(--papel);border:1px dashed var(--linha);border-radius:12px;padding:18px;text-align:center;color:var(--apagado);font-size:14px}

/* ---------- professor ---------- */
.aluno{all:unset;cursor:pointer;display:flex;align-items:center;gap:13px;background:var(--papel);border:1px solid var(--linha);
  border-radius:13px;padding:13px 15px;box-shadow:var(--sombra)}
.ini{width:40px;height:40px;border-radius:50%;background:var(--fundo);border:1px solid var(--linha);display:grid;place-items:center;
  font-family:var(--titulo);font-weight:700;font-size:17px;flex:none}
.aluno .i{flex:1;min-width:0}
.aluno .i b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aluno .i span{font-size:12.5px;color:var(--apagado)}
.seta{color:var(--apagado);flex:none}
.seta svg{width:17px;height:17px;display:block}
.editor{display:grid;gap:10px}
.linha-ex{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:13px}
.linha-ex .topo-ex{display:flex;gap:10px;align-items:center}
.linha-ex input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--linha);background:var(--fundo);color:var(--tinta);font-size:15px}
.linha-ex .nome{flex:1;min-width:0;font-weight:600}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.tres label span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado);font-weight:600;margin-bottom:4px}
.lixo{all:unset;cursor:pointer;color:var(--apagado);flex:none;padding:6px}
.lixo:hover{color:var(--forca)}
.lixo svg{width:17px;height:17px;display:block}
.barra-prof{display:flex;gap:10px;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;
  background:linear-gradient(to top,var(--fundo) 65%,transparent)}
.barra-prof .btn{flex:1}
.salvo{text-align:center;font-size:13px;color:var(--feito);font-weight:600;padding-top:8px;min-height:21px}

/* ---------- faixa de protótipo ---------- */
.faixa{background:var(--tinta);color:var(--fundo)}
.faixa .wrap{padding-block:7px;font-size:12px;text-align:center;opacity:.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="faixa"><div class="wrap">Protótipo de demonstração · os dados são de exemplo e ficam só neste aparelho</div></div>

<!-- ================= LOGIN ================= -->
<section id="login">
  <div class="wrap" style="width:100%">
    <div class="marca">

</section>

<!-- ================= ALUNO ================= -->
<section id="appAluno" hidden>
  <header class="topo">
    <div class="wrap">
      <div class="quem"><b id="nomeAluno">—</b><span id="planoAluno">—</span></div>
      <button class="icone" id="temaA" aria-label="Alternar claro e escuro" title="Claro / escuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button class="icone" id="sairA" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5M20 12H9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/></svg>
      </button>

  <div class="wrap">
    <div class="abas" id="abas" role="tablist"></div>

    <div class="progresso">

</section>

<!-- ================= PROFESSOR ================= -->
<section id="appProf" hidden>
  <header class="topo">
    <div class="wrap">
      <button class="icone" id="voltarProf" aria-label="Voltar" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="quem"><b id="tituloProf">Meus alunos</b><span id="subProf">Professor Marcos</span></div>
      <button class="icone" id="temaP" aria-label="Alternar claro e escuro" title="Claro / escuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button class="icone" id="sairP" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5M20 12H9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/></svg>
      </button>
    </div>
  </header>

  <div class="wrap">
    <div id="listaAlunos" class="lista"></div>

    <div id="fichaProf" hidden>
      <div class="abas" id="abasProf" role="tablist"></div>
      <div class="editor" id="editorEx" style="padding-block:12px"></div>
      <button class="btn secundario" id="addEx">+ Adicionar exercício</button>

      </div>
      <p class="salvo" id="salvo"></p>
    </div>
  </div>
</section>

<!-- cronômetro de descanso -->
<div class="timer" id="timer">
  <div class="timer-in">
    <b class="num" id="tTempo">60</b>
    <span class="q" id="tQual">Descanso</span>
    <button id="tFechar">Pular</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const guardar = (k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const ler = (k,p)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):p; }catch(e){ return p; } };

/* ---------- tema ---------- */
function aplicarTema(t){
  document.documentElement.setAttribute("data-theme",t);
  try{ localStorage.setItem("fm-tema",t); }catch(e){}
}
(function(){ let t=null; try{ t=localStorage.getItem("fm-tema"); }catch(e){}
  aplicarTema(t==="dark"||t==="light" ? t : (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")); })();
function ligarTema(btn){ btn.onclick=()=>aplicarTema(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); }
ligarTema($("temaA")); ligarTema($("temaP"));

/* ---------- dados de exemplo ---------- */
const BASE = {
  alunos: [
    { id:"ana", nome:"Ana Clara Nogueira", plano:"Hipertrofia · 3x por semana", visto:"hoje" },
    { id:"pedro", nome:"Pedro Brasileiro", plano:"Hipertrofia · 4x por semana", visto:"hoje" },
    { id:"joao", nome:"João Batista Ramos", plano:"Emagrecimento · 5x por semana", visto:"ontem" },
    { id:"marcia", nome:"Márcia Teixeira", plano:"Condicionamento · 3x por semana", visto:"há 3 dias" },
    { id:"rafael", nome:"Rafael Souza", plano:"Força · 4x por semana", visto:"há 5 dias" },
  ],
  fichas: {
    A:{ nome:"Treino A", foco:"Peito e tríceps", ex:[
      {n:"Supino reto com barra", g:"Peitoral", s:4, r:"10", c:"40 kg", d:90, o:"Desça a barra até encostar no peito, sem quicar."},
      {n:"Supino inclinado com halteres", g:"Peitoral", s:3, r:"12", c:"16 kg", d:60, o:""},
      {n:"Crucifixo na máquina", g:"Peitoral", s:3, r:"15", c:"35 kg", d:45, o:"Cotovelo levemente dobrado o tempo todo."},
      {n:"Tríceps na polia alta", g:"Tríceps", s:4, r:"12", c:"25 kg", d:45, o:""},
      {n:"Tríceps francês", g:"Tríceps", s:3, r:"12", c:"12 kg", d:45, o:""},
      {n:"Flexão de braço", g:"Peitoral", s:3, r:"até a falha", c:"peso do corpo", d:60, o:""},
    ]},
    B:{ nome:"Treino B", foco:"Costas e bíceps", ex:[
      {n:"Puxada frontal", g:"Dorsal", s:4, r:"10", c:"45 kg", d:90, o:"Puxe com os cotovelos, não com as mãos."},
      {n:"Remada curvada", g:"Dorsal", s:4, r:"10", c:"30 kg", d:90, o:""},
      {n:"Remada unilateral", g:"Dorsal", s:3, r:"12", c:"20 kg", d:60, o:""},
      {n:"Rosca direta", g:"Bíceps", s:4, r:"12", c:"15 kg", d:45, o:""},
      {n:"Rosca martelo", g:"Bíceps", s:3, r:"12", c:"12 kg", d:45, o:"Sem balançar o tronco."},
    ]},
    C:{ nome:"Treino C", foco:"Pernas e ombros", ex:[
      {n:"Agachamento livre", g:"Quadríceps", s:4, r:"10", c:"50 kg", d:120, o:"Joelho na direção do pé. Se doer, chame o professor."},
      {n:"Leg press 45°", g:"Quadríceps", s:4, r:"12", c:"120 kg", d:90, o:""},
      {n:"Cadeira extensora", g:"Quadríceps", s:3, r:"15", c:"40 kg", d:45, o:""},
      {n:"Mesa flexora", g:"Posterior", s:3, r:"15", c:"35 kg", d:45, o:""},
      {n:"Elevação lateral", g:"Ombros", s:3, r:"15", c:"8 kg", d:45, o:"Suba só até a linha do ombro."},
      {n:"Panturrilha em pé", g:"Panturrilha", s:4, r:"20", c:"60 kg", d:30, o:""},
    ]},
  },
};

let fichas = ler("fm-fichas", null) || JSON.parse(JSON.stringify(BASE.fichas));
let historico = ler("fm-hist", []);
let feitos = ler("fm-feitos", {});     // { "A-0": [true,false,...] }
let letraAtual = "A";

/* ---------- navegação ---------- */
function mostrar(qual){
  for(const s of ["login","appAluno","appProf"]) $(s).hidden = (s!==qual);
  scrollTo(0,0);
}
$("formLogin").addEventListener("submit", e=>{ e.preventDefault(); entrar("aluno"); });
document.querySelectorAll("[data-entrar]").forEach(b=> b.onclick=()=>entrar(b.dataset.entrar));
function entrar(papel){
  if(papel==="professor"){ mostrar("appProf"); verListaAlunos(); }
  else{
    $("nomeAluno").textContent="Pedro Brasileiro";
    $("planoAluno").textContent="Hipertrofia · 4x por semana · Prof. Marcos";
    mostrar("appAluno"); montarAbas(); verTreino();
  }
}
$("sairA").onclick=$("sairP").onclick=()=>mostrar("login");

/* ---------- aluno ---------- */
function montarAbas(){
  const cx=$("abas"); cx.innerHTML="";
  for(const L of Object.keys(fichas)){
    const b=document.createElement("button");
    b.className="aba"; b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(L===letraAtual));
    b.innerHTML=`<b>${L}</b>${fichas[L].foco}`;
    b.onclick=()=>{ letraAtual=L; montarAbas(); verTreino(); };
    cx.appendChild(b);
  }
}
function chaveEx(i){ return letraAtual+"-"+i; }
function verTreino(){
  const f=fichas[letraAtual];
  $("tituloTreino").textContent=f.nome.toUpperCase();
  const lista=$("listaEx"); lista.innerHTML="";
  f.ex.forEach((e,i)=>{
    const marcas = feitos[chaveEx(i)] || Array(e.s).fill(false);
    const completo = marcas.length===e.s && marcas.every(Boolean);
    const card=document.createElement("article");
    card.className="ex"+(completo?" pronto":"");
    card.innerHTML=`
      <div class="cab">
        <div class="ordem num">${String(i+1).padStart(2,"0")}</div>
        <div style="flex:1;min-width:0">
          <h3>${e.n}</h3>
          <span class="grupo">${e.g}</span>
          <div class="dados">
            <div class="dado"><b class="num">${e.s}×${e.r}</b><span>séries</span></div>
            <div class="dado"><b class="num">${e.c}</b><span>carga</span></div>
            <div class="dado"><b class="num">${e.d}s</b><span>descanso</span></div>
          </div>
          ${e.o?`<p class="obs">${e.o}</p>`:""}
          <div class="series"></div>
        </div>
      </div>`;
    const faixa=card.querySelector(".series");
    for(let k=0;k<e.s;k++){
      const s=document.createElement("button");
      s.className="serie"; s.textContent=k+1;
      s.setAttribute("aria-pressed", String(!!marcas[k]));
      s.setAttribute("aria-label", `Série ${k+1} de ${e.s} do exercício ${e.n}`);
      s.onclick=()=>{
        marcas[k]=!marcas[k];
        feitos[chaveEx(i)]=marcas; guardar("fm-feitos",feitos);
        if(marcas[k]) iniciarDescanso(e.d, e.n);
        verTreino();
      };
      faixa.appendChild(s);
    }
    const d=document.createElement("button");
    d.className="descanso";
    d.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg> Descansar ${e.d}s`;
    d.onclick=()=>iniciarDescanso(e.d, e.n);
    faixa.appendChild(d);
    lista.appendChild(card);
  });
  const total=f.ex.length;
  const prontos=f.ex.filter((e,i)=>{ const m=feitos[chaveEx(i)]||[]; return m.length===e.s && m.every(Boolean); }).length;
  $("contagem").textContent=`${prontos} de ${total} exercícios`;
  $("barra").style.width=(total?prontos/total*100:0)+"%";
  $("concluir").disabled = prontos===0;
  $("concluir").textContent = prontos===total && total ? "Treino completo — registrar" : "Concluir treino de hoje";
  verHistorico();
}
$("concluir").onclick=()=>{
  const f=fichas[letraAtual], total=f.ex.length;
  const prontos=f.ex.filter((e,i)=>{ const m=feitos[chaveEx(i)]||[]; return m.length===e.s && m.every(Boolean); }).length;
  historico.unshift({ data:new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}), treino:letraAtual, foco:f.foco, prontos, total });
  historico=historico.slice(0,8); guardar("fm-hist",historico);
  for(let i=0;i<total;i++) delete feitos[chaveEx(i)];
  guardar("fm-feitos",feitos);
  verTreino();
};
function verHistorico(){
  const h=$("hist");
  if(!historico.length){ h.innerHTML=`<p class="vazio">Quando você concluir um treino, ele aparece aqui.</p>`; return; }
  h.innerHTML=historico.map(x=>`<div><span>${x.data} · Treino ${x.treino} · ${x.foco}</span><b class="num">${x.prontos}/${x.total}</b></div>`).join("");
}

/* ---------- cronômetro ---------- */
let tInt=null;
function iniciarDescanso(seg, nome){
  clearInterval(tInt);
  let resta=seg;
  $("tQual").textContent="Descanso · "+nome;
  $("tTempo").textContent=resta;
  $("timer").classList.add("on");
  tInt=setInterval(()=>{
    resta--;
    $("tTempo").textContent=Math.max(0,resta);
    if(resta<=0){ clearInterval(tInt); $("tQual").textContent="Pode voltar para a série"; setTimeout(()=>$("timer").classList.remove("on"),2500); }
  },1000);
}
$("tFechar").onclick=()=>{ clearInterval(tInt); $("timer").classList.remove("on"); };

/* ---------- professor ---------- */
let alunoAberto=null, letraProf="A";
function verListaAlunos(){
  alunoAberto=null;
  $("tituloProf").textContent="Meus alunos";
  $("subProf").textContent=`Professor Marcos · ${BASE.alunos.length} alunos ativos`;
  $("voltarProf").hidden=true;
  $("fichaProf").hidden=true;
  const cx=$("listaAlunos"); cx.hidden=false; cx.innerHTML="";
  BASE.alunos.forEach(a=>{
    const b=document.createElement("button");
    b.className="aluno";
    b.innerHTML=`<span class="ini">${a.nome[0]}</span>
      <span class="i"><b>${a.nome}</b><span>${a.plano} · treinou ${a.visto}</span></span>
      <span class="seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>`;
    b.onclick=()=>abrirAluno(a);
    cx.appendChild(b);
  });
}
function abrirAluno(a){
  alunoAberto=a; letraProf="A";
  $("tituloProf").textContent=a.nome;
  $("subProf").textContent=a.plano;
  $("voltarProf").hidden=false;
  $("listaAlunos").hidden=true;
  $("fichaProf").hidden=false;
  $("salvo").textContent="";
  abasProf(); editor();
}
$("voltarProf").onclick=verListaAlunos;
function abasProf(){
  const cx=$("abasProf"); cx.innerHTML="";
  for(const L of Object.keys(fichas)){
    const b=document.createElement("button");
    b.className="aba"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",String(L===letraProf));
    b.innerHTML=`<b>${L}</b>${fichas[L].foco}`;
    b.onclick=()=>{ letraProf=L; abasProf(); editor(); };
    cx.appendChild(b);
  }
}
function editor(){
  const cx=$("editorEx"); cx.innerHTML="";
  fichas[letraProf].ex.forEach((e,i)=>{
    const d=document.createElement("div");
    d.className="linha-ex";
    d.innerHTML=`
      <div class="topo-ex">
        <input class="nome" id="pn${i}" value="${e.n.replace(/"/g,"&quot;")}" aria-label="Nome do exercício">
        <button class="lixo" aria-label="Remover exercício">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        </button>
      </div>
      <div class="tres">
        <label><span>Séries</span><input type="number" min="1" max="10" id="ps${i}" value="${e.s}"></label>
        <label><span>Repetições</span><input id="pr${i}" value="${e.r}"></label>
        <label><span>Carga</span><input id="pc${i}" value="${e.c}"></label>
      </div>`;
    d.querySelector(".lixo").onclick=()=>{ fichas[letraProf].ex.splice(i,1); editor(); };
    cx.appendChild(d);
  });
  if(!fichas[letraProf].ex.length) cx.innerHTML=`<p class="vazio">Nenhum exercício neste treino ainda.</p>`;
}
$("addEx").onclick=()=>{ fichas[letraProf].ex.push({n:"Novo exercício",g:"Geral",s:3,r:"12",c:"—",d:60,o:""}); editor(); };
$("salvarFicha").onclick=()=>{
  fichas[letraProf].ex.forEach((e,i)=>{
    const n=$("pn"+i), s=$("ps"+i), r=$("pr"+i), c=$("pc"+i);
    if(n) e.n=n.value.trim()||e.n;
    if(s) e.s=Math.max(1,Math.min(10,Number(s.value)||e.s));
    if(r) e.r=r.value.trim()||e.r;
    if(c) e.c=c.value.trim()||e.c;
  });
  guardar("fm-fichas",fichas);
  feitos={}; guardar("fm-feitos",feitos);
  $("salvo").textContent=`Ficha salva. ${alunoAberto?alunoAberto.nome.split(" ")[0]:"O aluno"} já vê a mudança no celular.`;
  editor();
};

verHistorico();
</script>
